<svg width="620" height="147" viewBox="0 0 620 147" xmlns="http://www.w3.org/2000/svg">
<style>
    text { font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
