name: Update profile stats

# No push trigger: this job commits svg/card.svg, and a push trigger would
# make it re-run on its own commit.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate SVG from the GitHub GraphQL API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: SID-6921
          OUT_DIR: svg
        run: python3 scripts/generate_stats.py

      - name: Commit changed graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add svg
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh profile stats"
          git push
