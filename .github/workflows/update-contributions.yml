name: Update OSS contributions table

on:
  schedule:
    - cron: "0 13 * * *"  # daily, 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run mechanical update script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/update_oss_table.sh
          ./scripts/update_oss_table.sh

      - name: Open PR if anything changed (auto-merge only when purely mechanical)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet README.md scripts/.star_snapshot.json; then
            echo "No changes, nothing to do."
            exit 0
          fi
          BRANCH="auto/oss-contributions-update-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add README.md scripts/.star_snapshot.json
          git commit -m "Auto-update OSS contributions stats and table"
          git push origin "$BRANCH"

          if git diff HEAD^ HEAD -- README.md | grep -q "DRAFT: needs review"; then
            # update_oss_table.sh found a newly-merged repo with no narrative
            # write-up and appended a draft stub for it. That's prose, not
            # one of the mechanical fields this job normally touches, so it
            # waits for a human to write the real Impact/Severity paragraph
            # and merge by hand -- no auto-merge on this run.
            gh pr create \
              --title "New contributor repo needs a write-up before merging" \
              --body "Mechanical refresh of the Snapshot line, Under review table, and star-trend snapshot, plus a draft stub paragraph for a newly-merged repo with no write-up yet. Fill in the TODO Impact/Severity lines, then merge manually -- this run does not auto-merge." \
              --head "$BRANCH" \
              --base main
          else
            # This step only ever touches README.md and the star-snapshot file,
            # both written exclusively by update_oss_table.sh above -- no
            # narrative content, no other file can reach this point. Approved
            # by the user (2026-10-09) to auto-merge without manual review,
            # since it's a mechanical, script-only diff every time.
            gh pr create \
              --title "Auto-update: OSS contributions stats and table" \
              --body "Mechanical refresh of the Snapshot line, Under review table, and star-trend snapshot from live GitHub data. No narrative sections touched. Auto-merged." \
              --head "$BRANCH" \
              --base main
            gh pr merge "$BRANCH" --merge --delete-branch
          fi
